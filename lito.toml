[package]
name = "ncrequest"
version = "0.2.1"
license = "MIT"
authors = ["hypengw <hypengwip@gmail.com>"]

[lib]
name = "ncrequest"
module = "ncrequest"
archive = "ncrequest"

[features.curl]
default = false

[features.qt]
default = false

[external-dependencies.pkg-config.curl]
module = "libcurl"
version = ">= 7.77"
condition = "feature.curl"

[external-dependencies.cmake.qt6]
condition = "feature.qt"
package = "Qt6"
components = ["Core", "Network", "WebSockets"]
targets = [
  { name = "Qt6::Core", pub = true },
  { name = "Qt6::Network", pub = true },
  { name = "Qt6::WebSockets", pub = true },
]

[dependencies]
rstd-std = { version = "0.1.11", pub = true }
rstd-json = { version = "0.1.11", pub = true }
lihttpto = { version = "0.1.2", pub = true }
lifetchto = { version = "0.1.0", features = ["http", "tls"], pub = true }
liwebsocketo = { version = "0.1.1", pub = true }

[[test]]
name = "ncrequest-tests"
sources = ["test/main.cpp", "test/session.cpp", "test/http.cpp", "test/upload.cpp", "test/cache.cpp", "test/qt_cache.cpp", "test/qt_resource.cpp", "test/http_peer.cpp", "test/adapters.cpp", "test/managed_duplex.cpp", "test/upgrade.cpp", "test/websocket_connection.cpp", "test/websocket.cpp", "test/qt_websocket.cpp", "test/qt_events.cpp", "test/websocket_flow.cpp", "test/transport.cpp"]
link-stdlib = true

[dev-dependencies]
rstd-test = { version = "0.1.11" }
rstd-nostd = { version = "0.1.11", usage = "link" }

[profile.base]
exceptions = false
rtti = false
