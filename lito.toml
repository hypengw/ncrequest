[package]
name = "ncrequest"
version = "0.2.0"
license = "MIT"
authors = ["hypengw <hypengwip@gmail.com>"]

[lib]
name = "ncrequest"
module = "ncrequest"
archive = "ncrequest"

[dependencies]
rstd-std = { version = "0.1.9", pub = true }
rstd-json = { version = "0.1.9", pub = true }
lihttpto = { version = "0.1.1", pub = true }
lifetchto = { version = "0.1.0", features = ["http", "tls"], pub = true }

[[test]]
name = "ncrequest-tests"
sources = ["test/main.cpp", "test/session.cpp", "test/http.cpp", "test/upload.cpp", "test/cache.cpp", "test/http_peer.cpp"]
link-stdlib = false

[dev-dependencies]
rstd-test = { version = "0.1.9" }
rstd-nostd = { version = "0.1.9", usage = "link" }

[profile.base]
exceptions = false
rtti = false
